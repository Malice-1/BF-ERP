{% load i18n admin_navigation %}

  <div class="purchase-request-filter">
    <span class="purchase-filter-menu">{% include 'purchasing/action_icon.html' with icon='filter' %}</span>
    <input type="search" id="nav-filter" placeholder="Filtrer la navigation…" aria-label="Filtrer les éléments de navigation">

  {% grouped_admin_apps available_apps as grouped_apps %}
