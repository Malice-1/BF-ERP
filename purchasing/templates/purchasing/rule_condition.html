<fieldset class="condition-row"><legend>Condition</legend>{{ condition.non_field_errors }}
<div class="condition-inputs"><div>{{ condition.field.label_tag }}{{ condition.field }}{{ condition.field.errors }}</div><div>{{ condition.op.label_tag }}{{ condition.op }}{{ condition.op.errors }}</div><div class="condition-value">{{ condition.value.label_tag }}{{ condition.value }}{{ condition.value.errors }}</div></div>
<p>{{ condition.DELETE }} <label class="inline-label" for="{{ condition.DELETE.id_for_label }}">Retirer cette condition à l’enregistrement</label></p>
</fieldset>
