{% extends 'hr/base.html' %}{% load static %}
{% block hr_content %}
<div class="page-heading"><h1>Employés</h1>
{% if perms.hr.add_employee %}<a class="button" href="{% url 'hr:employee_new' %}">Nouvel employé</a>{% endif %}
</div>
<form id="employee-search" method="get" action="{% url 'hr:employees' %}" class="ledger-filters" role="search">
<label>Rechercher <input name="q" type="search" value="{{ query }}" placeholder="Nom, matricule ou service"></label>
<label>Statut <select name="status">
<option value="">Tous</option>
<option value="active"{% if status == 'active' %} selected{% endif %}>Actifs</option>
<option value="inactive"{% if status == 'inactive' %} selected{% endif %}>Inactifs</option>
</select></label>
<noscript><button>Rechercher</button></noscript>
</form>
<p id="employee-search-status" role="status"></p>
<div id="employee-results">{% include 'hr/employee_results.html' %}</div>
<script src="{% static 'hr/employee_search.js' %}" defer></script>
{% endblock %}
